<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Support the development of sc jams, a free, open-source listening room for SoundCloud.">
  <title>Support · sc jams</title>
  <script src="/theme.js"></script>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script src="/icons.js" defer></script>
  <script src="/support.js" defer></script>
</head>
<body>
  <main class="app-shell support-shell">
    <header class="app-header"><a class="brand" href="/"><span class="brand-mark" aria-hidden="true"><svg data-icon="audio-lines"></svg></span><span>sc jams</span></a><button id="theme-toggle" class="icon-button theme-toggle" type="button" aria-label="Switch color theme" title="Switch color theme"><svg data-icon="moon"></svg></button></header>
    <section class="support-content" aria-labelledby="support-title">
      <span class="support-icon"><svg data-icon="coffee"></svg></span>
      <h1 id="support-title">Keep the music going.</h1>
      <p class="muted">sc jams is free and open source. If you enjoy listening together, a little support helps keep it growing.</p>
      <a id="donation-link" class="button primary" target="_blank" rel="noopener noreferrer" hidden><svg data-icon="coffee"></svg>Buy me a coffee</a>
      <p id="donation-status" class="muted" role="status">Donations aren’t open yet. A star on GitHub is another way to show your support.</p>
      <a class="button secondary" href="https://github.com/bwaeden/sc-jams" target="_blank" rel="noopener noreferrer"><svg data-icon="github"></svg>Star on GitHub</a>
    </section>
    <footer class="app-footer"><a class="footer-link" href="/"><svg data-icon="arrow-left"></svg>Back to sc jams</a><a class="footer-link" href="https://github.com/bwaeden/sc-jams" target="_blank" rel="noopener noreferrer" aria-label="sc jams on GitHub"><svg data-icon="github"></svg>GitHub</a></footer>
  </main>
</body>
</html>
